      accessToken?: TEXT
      refreshToken?: TEXT
      idToken?: TEXT
      accessTokenExpiresAt?: TEXT
      refreshTokenExpiresAt?: TEXT
      scope?: TEXT
      password?: TEXT
      createdAt: TEXT
      updatedAt: TEXT
  deviceCode:
    columns:
      id: TEXT PRIMARY KEY
      deviceCode: TEXT
      userCode: TEXT
      userId?: TEXT
      expiresAt: TEXT
      status: TEXT
      lastPolledAt?: TEXT
      pollingInterval?: INTEGER
      clientId?: TEXT
      scope?: TEXT
  jwks:
    columns:
      id: TEXT PRIMARY KEY
      publicKey: TEXT
      privateKey: TEXT
      createdAt: TEXT
      expiresAt?: TEXT
      alg?: TEXT
      crv?: TEXT
  oauthAccessToken:
    columns:
      id: TEXT PRIMARY KEY
      token?: TEXT UNIQUE
      clientId: TEXT REFERENCES "oauthClient"("clientId") ON DELETE CASCADE
      sessionId?: TEXT REFERENCES "session"("id") ON DELETE SET NULL
      userId?: TEXT REFERENCES "user"("id") ON DELETE CASCADE
      referenceId?: TEXT
      authorizationCodeId?: TEXT
      resources?: TEXT
      requestedUserInfoClaims?: TEXT
      refreshId?: TEXT REFERENCES "oauthRefreshToken"("id") ON DELETE CASCADE
      expiresAt?: TEXT
      createdAt?: TEXT
      revoked?: TEXT
      confirmation?: TEXT
      scopes: TEXT
  oauthClient:
    columns:
      id: TEXT PRIMARY KEY
      clientId: TEXT UNIQUE
      clientSecret?: TEXT
      clientDiscoveryId?: TEXT
      disabled?: INTEGER
      skipConsent?: INTEGER
      enableEndSession?: INTEGER
      subjectType?: TEXT
      scopes?: TEXT
      clientCredentialsScopes?: TEXT
      userId?: TEXT REFERENCES "user"("id") ON DELETE CASCADE
      createdAt?: TEXT
      updatedAt?: TEXT
      name?: TEXT
      uri?: TEXT
      icon?: TEXT
      contacts?: TEXT
      tos?: TEXT
      policy?: TEXT
      softwareId?: TEXT
      softwareVersion?: TEXT
      softwareStatement?: TEXT
      redirectUris: TEXT
      postLogoutRedirectUris?: TEXT
      backchannelLogoutUri?: TEXT
      backchannelLogoutSessionRequired?: INTEGER
      tokenEndpointAuthMethod?: TEXT
      applicationType?: TEXT
