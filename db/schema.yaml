      jwksUri?: TEXT
      grantTypes?: TEXT
      responseTypes?: TEXT
      requirePKCE?: INTEGER
      dpopBoundAccessTokens?: INTEGER
      referenceId?: TEXT
      metadata?: TEXT
  oauthClientAssertion:
