format: boxdb-schema
version: 1
pragmas:
  application_id: 1112496196
tables:
  deviceCode:
    columns:
      id: TEXT PRIMARY KEY
      deviceCode: TEXT
      userCode: TEXT
      userId?: TEXT
      expiresAt: TEXT
      status: TEXT
      lastPolledAt?: TEXT
      pollingInterval?: INTEGER
      clientId?: TEXT
      scope?: TEXT
  polydays_changes:
    columns:
      seq: INTEGER PRIMARY KEY AUTOINCREMENT
      user_id: TEXT
      entity_id: TEXT
      body: JSON
  polydays_documents:
    columns:
      user_id: TEXT
      id: TEXT
      kind: ENUM('calendar', 'task', 'series')
      body: JSON
      revision: INTEGER
    constraints:
      - primary_key: [user_id, id]
  polydays_operations:
    columns:
      user_id: TEXT
      id: TEXT
      result: JSON
    constraints:
      - primary_key: [user_id, id]
  polydays_schedule_slots:
    columns:
      user_id: TEXT
      version_id: TEXT
      slot_id: TEXT
      effective_date: DATE
      name: TEXT
      starts_at: TIME
      ends_at: TIME
      time_zone: TEXT
    constraints:
      - primary_key: [user_id, version_id, slot_id]
indexes:
  deviceCode_deviceCode_idx:
    type: unique
    table: deviceCode
    expressions:
      - '"deviceCode"'
  deviceCode_userCode_idx:
    type: unique
    table: deviceCode
    expressions:
      - '"userCode"'
  polydays_changes_user_seq:
    type: regular
    table: polydays_changes
    expressions:
      - user_id
      - seq
