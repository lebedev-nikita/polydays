      id: TEXT PRIMARY KEY
      expiresAt: TEXT
  oauthClientResource:
    columns:
      id: TEXT PRIMARY KEY
      clientId: TEXT REFERENCES "oauthClient"("clientId") ON DELETE CASCADE
      resourceId: TEXT REFERENCES "oauthResource"("identifier") ON DELETE CASCADE
      metadata?: TEXT
      createdAt?: TEXT
  oauthConsent:
    columns:
      id: TEXT PRIMARY KEY
      clientId: TEXT REFERENCES "oauthClient"("clientId") ON DELETE CASCADE
      userId?: TEXT REFERENCES "user"("id") ON DELETE CASCADE
      referenceId?: TEXT
      resources?: TEXT
      requestedUserInfoClaims?: TEXT
      scopes: TEXT
      createdAt?: TEXT
      updatedAt?: TEXT
  oauthRefreshToken:
    columns:
      id: TEXT PRIMARY KEY
      token: TEXT UNIQUE
      clientId: TEXT REFERENCES "oauthClient"("clientId") ON DELETE CASCADE
      sessionId?: TEXT REFERENCES "session"("id") ON DELETE SET NULL
      userId: TEXT REFERENCES "user"("id") ON DELETE CASCADE
      referenceId?: TEXT
      authorizationCodeId?: TEXT
      resources?: TEXT
      requestedUserInfoClaims?: TEXT
      expiresAt?: TEXT
      createdAt?: TEXT
      revoked?: TEXT
      rotatedAt?: TEXT
      rotationReplayResponse?: TEXT
      rotationReplayExpiresAt?: TEXT
      authTime?: TEXT
      confirmation?: TEXT
      scopes: TEXT
  oauthResource:
    columns:
      id: TEXT PRIMARY KEY
      identifier: TEXT UNIQUE
      name: TEXT
      accessTokenTtl?: REAL
      refreshTokenTtl?: REAL
      signingAlgorithm?: TEXT
      signingKeyId?: TEXT
      allowedScopes?: TEXT
      customClaims?: TEXT
      dpopBoundAccessTokensRequired?: INTEGER
      disabled?: INTEGER
      createdAt?: TEXT
      updatedAt?: TEXT
      policyVersion?: REAL
      metadata?: TEXT
  polydays_changes:
    columns:
      seq: INTEGER PRIMARY KEY AUTOINCREMENT
      user_id: TEXT
      entity_id: TEXT
      body: JSON
  polydays_commands:
    columns:
      user_id: TEXT
      id: TEXT
      input: JSON
      result: JSON
    constraints:
      - primary_key: [user_id, id]
  polydays_documents:
    columns:
      user_id: TEXT
      id: TEXT
      kind: ENUM('calendar', 'task', 'series')
      body: JSON
      revision: INTEGER
    constraints:
      - primary_key: [user_id, id]
  polydays_operations:
    columns:
      user_id: TEXT
      id: TEXT
      result: JSON
    constraints:
      - primary_key: [user_id, id]
  polydays_schedule_slots:
    columns:
      user_id: TEXT
      version_id: TEXT
      slot_id: TEXT
      effective_date: DATE
      name: TEXT
      starts_at: TIME
      ends_at: TIME
      time_zone: TEXT
    constraints:
      - primary_key: [user_id, version_id, slot_id]
  session:
    columns:
      id: TEXT PRIMARY KEY
      expiresAt: TEXT
      token: TEXT UNIQUE
      createdAt: TEXT
      updatedAt: TEXT
      ipAddress?: TEXT
      userAgent?: TEXT
      userId: TEXT REFERENCES "user"("id") ON DELETE CASCADE
  user:
    columns:
      id: TEXT PRIMARY KEY
      name: TEXT
      email: TEXT UNIQUE
      emailVerified: INTEGER
      image?: TEXT
      createdAt: TEXT
      updatedAt: TEXT
  verification:
    columns:
      id: TEXT PRIMARY KEY
      identifier: TEXT
      value: TEXT
      expiresAt: TEXT
      createdAt: TEXT
      updatedAt: TEXT
indexes:
  deviceCode_deviceCode_idx:
    type: unique
    table: deviceCode
    expressions:
      - '"deviceCode"'
  deviceCode_userCode_idx:
    type: unique
    table: deviceCode
    expressions:
      - '"userCode"'
  polydays_changes_user_seq:
    type: regular
    table: polydays_changes
    expressions:
      - user_id
      - seq
